<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi AM</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            color: #1f2937;
            margin-top: 0;
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3b82f6;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            background: #3b82f6;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        /* Animasi Transisi antar Step */
        .step {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        .step.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Notifikasi (Alert) */
        .alert {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            text-align: left;
            word-break: break-word;
        }
        .alert.error { background: #fee2e2; color: #b91c1c; display: block; }
        .alert.success { background: #d1fae5; color: #047857; display: block; }
        .alert.loading { background: #e5e7eb; color: #4b5563; display: block; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- LANGKAH 1: Masukkan Email -->
        <div id="step1" class="step active">
            <h1>Langkah 1</h1>
            <p class="subtitle">Masukkan email untuk menerima akses.</p>
            
            <div class="input-group">
                <input type="email" id="emailInput" placeholder="contoh@gmail.com" required>
            </div>
            <button id="btnSend" onclick="sendEmail()">Lanjutkan</button>
            <div id="msgStep1" class="alert"></div>
        </div>

        <!-- LANGKAH 2: Masukkan Link Verifikasi -->
        <div id="step2" class="step">
            <h1>Langkah 2</h1>
            <p class="subtitle">Masukkan link verifikasi yang Anda dapatkan.</p>
            
            <div class="input-group">
                <input type="url" id="linkInput" placeholder="https://..." required>
            </div>
            <button id="btnVerif" onclick="verifyLink()">Verifikasi Sekarang</button>
            <div id="msgStep2" class="alert"></div>
        </div>

    </div>

    <script>
        // Fungsi untuk menampilkan pesan status
        function showMessage(elementId, type, text) {
            const el = document.getElementById(elementId);
            el.className = `alert ${type}`;
            el.innerHTML = text;
        }

        // Fungsi Langkah 1: Kirim Email
        async function sendEmail() {
            const email = document.getElementById('emailInput').value.trim();
            const btn = document.getElementById('btnSend');

            if (!email) {
                showMessage('msgStep1', 'error', 'Harap masukkan alamat email terlebih dahulu!');
                return;
            }

            btn.disabled = true;
            showMessage('msgStep1', 'loading', 'Memproses, mohon tunggu...');

            try {
                // Mengirim email sebagai parameter (Contoh: /api/send?email=contoh@gmail.com)
                // Sesuaikan 'email=' jika API aslinya menggunakan nama parameter lain
                const response = await fetch(`/api/send?email=${encodeURIComponent(email)}`);
                const data = await response.json().catch(() => ({})); 

                // Cek apakah response dari server sukses (HTTP 200 OK)
                if (response.ok) {
                    showMessage('msgStep1', 'success', 'Berhasil! Melanjutkan ke langkah verifikasi...');
                    
                    // Lanjut ke Step 2 setelah delay 1.5 detik agar tulisan 'Berhasil' terbaca
                    setTimeout(() => {
                        document.getElementById('step1').classList.remove('active');
                        document.getElementById('step2').classList.add('active');
                    }, 1500);
                } else {
                    // Jika gagal dari server
                    const errorMsg = data.message || data.error || 'Terjadi kesalahan pada sistem.';
                    showMessage('msgStep1', 'error', `Gagal: ${errorMsg}`);
                }
            } catch (error) {
                showMessage('msgStep1', 'error', 'Gagal menghubungi server. Periksa koneksi Anda.');
            } finally {
                btn.disabled = false;
            }
        }

        // Fungsi Langkah 2: Verifikasi Link
        async function verifyLink() {
            const link = document.getElementById('linkInput').value.trim();
            const btn = document.getElementById('btnVerif');

            if (!link) {
                showMessage('msgStep2', 'error', 'Harap masukkan link verifikasi!');
                return;
            }

            btn.disabled = true;
            showMessage('msgStep2', 'loading', 'Memverifikasi link, mohon tunggu...');

            try {
                // Mengirim link sebagai parameter (Contoh: /api/verif?link=https://...)
                // Sesuaikan 'link=' jika API aslinya menggunakan nama parameter yang berbeda
                const response = await fetch(`/api/verif?link=${encodeURIComponent(link)}`);
                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    // Jika API verifikasi merespon sukses
                    const successMsg = data.message || 'Verifikasi Berhasil! Akses telah diberikan.';
                    showMessage('msgStep2', 'success', successMsg);
                    
                    // Opsional: Sembunyikan input dan tombol setelah sukses
                    document.getElementById('linkInput').style.display = 'none';
                    btn.style.display = 'none';
                } else {
                    // Jika verifikasi gagal (Link salah, kedaluwarsa, dll)
                    const errorMsg = data.message || data.error || 'Link tidak valid atau sudah kedaluwarsa.';
                    showMessage('msgStep2', 'error', `Gagal: ${errorMsg}`);
                }
            } catch (error) {
                showMessage('msgStep2', 'error', 'Gagal menghubungi server. Periksa koneksi Anda.');
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
